; CYD UniFi Monitor - one environment per "Cheap Yellow Display" board.
;
;   pio run -e cyd-2432s028-2usb -t upload     (build + flash one board)
;   pio run                                    (build every board)
;
; Boards marked "untested" are built from the published pinouts. If yours works
; (or doesn't), please open an issue so the table in the README can be updated.

[platformio]
default_envs = cyd-2432s028-2usb

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.4.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; Shared by every board: display SPI bus pins and fonts
build_flags =
    -Iinclude
    -D USER_SETUP_LOADED=1
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D DEBUG_API=0

; ---------------------------------------------------------------------------
; 2.8" ESP32-2432S028 "CYD2USB" (USB-C + micro-USB), ST7789 - tested
[env:cyd-2432s028-2usb]
build_flags =
    ${env.build_flags}
    -D BOARD_NAME='"ESP32-2432S028 (2.8in, 2 USB)"'
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D TOUCH_XPT_OWN_SPI=1

; 2.8" ESP32-2432S028R classic CYD (micro-USB only), ILI9341 - untested
[env:cyd-2432s028r]
build_flags =
    ${env.build_flags}
    -D BOARD_NAME='"ESP32-2432S028R (2.8in)"'
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D TOUCH_XPT_OWN_SPI=1

; 2.4" ESP32-2432S024R, ILI9341, touch shares the display bus - untested
[env:cyd-2432s024r]
build_flags =
    ${env.build_flags}
    -D BOARD_NAME='"ESP32-2432S024R (2.4in)"'
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=27
    -D TOUCH_CS=33

; 3.2" ESP32-2432S032R, ST7789, touch shares the display bus - untested
[env:cyd-2432s032r]
build_flags =
    ${env.build_flags}
    -D BOARD_NAME='"ESP32-2432S032R (3.2in)"'
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=27
    -D TOUCH_CS=33

; 3.5" ESP32-3248S035R, ST7796 480x320, touch shares the display bus - untested
[env:cyd-3248s035r]
build_flags =
    ${env.build_flags}
    -D BOARD_NAME='"ESP32-3248S035R (3.5in)"'
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_BL=27
    -D TOUCH_CS=33
